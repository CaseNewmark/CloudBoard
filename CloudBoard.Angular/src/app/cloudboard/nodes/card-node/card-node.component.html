<p-card class="card-node">
    @if (hasImage) {
    <ng-template #header>
        <p-image
            class="pointer-events-none"
            [src]="imageUrl"
            [alt]="node()?.name"
            imageClass="w-full h-auto"
            [preview]="false" ></p-image>
    </ng-template>
    }
    <ng-template #title>
        <div class="card-title">{{ title }}</div>
    </ng-template>
    @if (subtitle) {
    <ng-template #subtitle>
        <div class="card-subtitle">{{ subtitle }}</div>
    </ng-template>
    }
    <div class="card-content">
        {{ content }}
    </div>
</p-card>
